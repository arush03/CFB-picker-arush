name: Update predictions

on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesdays, after the AP poll is out
    - cron: "0 14 * * 6"   # Saturdays, refresh before kickoffs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/predict.py
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/predictions.json
          git diff --staged --quiet || git commit -m "Update predictions"
          git push

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 25 Game Predictor</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f4; --line:#ddd; --good:#1a7f37; --bad:#c62828; --accent:#1f4e9c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#9a9a9a; --card:#1e1e1e; --line:#333; --good:#4cc26b; --bad:#ef6a6a; --accent:#7aa7ff; }
  }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); max-width:860px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .game { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .teams { font-weight:600; }
  .rk { color:var(--muted); font-weight:400; font-size:.85rem; }
  .pick { color:var(--accent); font-weight:700; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:8px 0; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .why { font-size:.88rem; color:var(--muted); }
  details { margin-top:8px; font-size:.85rem; }
  summary { cursor:pointer; color:var(--accent); }
  table { border-collapse:collapse; width:100%; margin-top:6px; }
  th, td { text-align:right; padding:3px 6px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .ok { color:var(--good); } .miss { color:var(--bad); }
  footer { color:var(--muted); font-size:.8rem; margin-top:20px; }
</style>
</head>
<body>
<h1>Top 25 Game Predictor</h1>
<div class="sub" id="meta">Loading…</div>
<div id="games"></div>
<footer>Model: blended SP+ power rating and pass/rush matchup (PPA), plus home field. Data: CollegeFootballData.com. For fun and analysis, not betting advice.</footer>
<script>
const fmtRank = r => r ? `<span class="rk">#${r}</span> ` : "";
const fmtNet = x => (x > 0 ? "+" : "") + x.toFixed(1);

function halvesTable(g, teams) {
  const rows = [g.away, g.home].filter(t => teams[t]).map(t => {
    const s = teams[t];
    return `<tr><td>${t}</td><td>${fmtNet(s.h1_net)}</td><td>${fmtNet(s.h2_net)}</td><td>${s.better_half}</td><td>${s.ot_wins}-${s.ot_games - s.ot_wins}</td></tr>`;
  }).join("");
  if (!rows) return "";
  return `<details><summary>Halves &amp; overtime</summary>
    <table><tr><th>Team</th><th>1H net/g</th><th>2H net/g</th><th>Stronger half</th><th>OT W-L</th></tr>${rows}</table></details>`;
}

fetch("data/predictions.json").then(r => r.json()).then(d => {
  const rec = d.week_record.total ? ` · Finished games this week: ${d.week_record.correct}-${d.week_record.total - d.week_record.correct}` : "";
  document.getElementById("meta").textContent = `${d.year} season, Week ${d.week} · Updated ${new Date(d.generated).toLocaleString()}${rec}`;
  const el = document.getElementById("games");
  if (!d.games.length) { el.textContent = "No ranked games found for this week."; return; }
  el.innerHTML = d.games.map(g => {
    const when = g.start ? new Date(g.start).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}) : "";
    const result = g.completed ? ` · Final ${g.away} ${g.away_points}, ${g.home} ${g.home_points} <span class="${g.correct ? "ok" : "miss"}">${g.correct ? "✓" : "✗"}</span>` : "";
    return `<div class="game">
      <div class="row"><div class="teams">${fmtRank(g.away_rank)}${g.away} <span class="rk">${g.neutral ? "vs" : "at"}</span> ${fmtRank(g.home_rank)}${g.home}</div>
        <div class="rk">${when}${result}</div></div>
      <div class="row" style="margin-top:6px"><span>Pick: <span class="pick">${g.pick}</span> by ${g.margin}</span><span>${Math.round(g.win_prob * 100)}%</span></div>
      <div class="bar"><div style="width:${g.win_prob * 100}%"></div></div>
      <div class="why">${g.reason}</div>
      ${halvesTable(g, d.teams)}
    </div>`;
  }).join("");
}).catch(() => { document.getElementById("meta").textContent = "No predictions yet. Run the workflow or python src/predict.py first."; });
</script>
</body>
</html>
